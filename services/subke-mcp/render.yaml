services:
  - type: web
    name: subke-mcp
    runtime: node
    plan: free
    region: frankfurt
    branch: subke-mcp
    rootDir: services/subke-mcp
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SUBKE_WRITE_ENABLED
        value: "true"
      - key: MCP_ACCESS_TOKEN
        generateValue: true
      - key: SUBKE_API_KEY
        sync: false
